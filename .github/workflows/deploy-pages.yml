name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare direct CV site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets

          cat \
            assets/cv-part-00.b64 \
            assets/cv-part-01.b64 \
            assets/cv-part-02.b64 \
            assets/cv-part-03.b64 \
            | tr -d '\r\n ' \
            | base64 --decode > _site/index.html

          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          svg = Path('assets/profile.svg').read_text(encoding='utf-8')
          match = re.search(r'data:image/jpeg;base64,([^\"]+)', svg)
          if not match:
              raise SystemExit('Embedded JPEG was not found in assets/profile.svg')

          photo_path = Path('_site/assets/profile.jpg')
          photo_path.write_bytes(base64.b64decode(match.group(1)))
          if photo_path.stat().st_size < 1000:
              raise SystemExit('Decoded profile photograph is unexpectedly small')

          html_path = Path('_site/index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('assets/profile.svg', 'assets/profile.jpg?v=20260805-jpg')
          html_path.write_text(html, encoding='utf-8')
          PY

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
