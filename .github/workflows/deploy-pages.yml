name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        env:
          SITE_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html cv-fixes.css cv-fixes.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import os

          version = os.environ['SITE_VERSION'][:12]
          path = Path('_site/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('</head>', f'  <link rel="stylesheet" href="./cv-fixes.css?v={version}">\n</head>')
          html = html.replace('</body>', f'  <script src="./cv-fixes.js?v={version}"></script>\n</body>')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
