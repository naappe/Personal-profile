name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare direct CV site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cat \
            assets/cv-part-00.b64 \
            assets/cv-part-01.b64 \
            assets/cv-part-02.b64 \
            assets/cv-part-03.b64 \
            | tr -d '\r\n ' \
            | base64 --decode > _site/index.html
          cp assets/profile.svg _site/assets/profile.svg
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
