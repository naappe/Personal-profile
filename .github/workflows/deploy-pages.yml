name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Vinorva employment dates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('from 2023 to 2026', 'from 2023 to 2025')
          html = html.replace('<div class="job-date">2023 - 2026</div>', '<div class="job-date">2023 - 2025</div>')
          html = html.replace("'jenisha-professional-cv-v5'", "'jenisha-professional-cv-v6'")
          html = html.replace(
              "localStorage.removeItem('jenisha-professional-cv-v4');",
              "localStorage.removeItem('jenisha-professional-cv-v4');\nlocalStorage.removeItem('jenisha-professional-cv-v5');"
          )

          if 'from 2023 to 2025' not in html:
              raise SystemExit('Profile Vinorva date correction failed')
          if '<div class="job-date">2023 - 2025</div>' not in html:
              raise SystemExit('Experience Vinorva date correction failed')
          if 'jenisha-professional-cv-v6' not in html:
              raise SystemExit('Storage version upgrade failed')
          if html.count('data:image/jpeg;base64,') != 1:
              raise SystemExit('Expected exactly one embedded profile photograph')

          path.write_text(html, encoding='utf-8')
          PY

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '4189820+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Correct Vinorva employment period to 2023-2025'
            git push origin HEAD:main
          fi

      - name: Validate self-contained CV
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'data:image/jpeg;base64,' index.html
          grep -q 'jenisha-professional-cv-v6' index.html
          grep -q 'from 2023 to 2025' index.html
          grep -q '<div class="job-date">2023 - 2025</div>' index.html
          grep -q 'Monitor stock requirements and support timely replenishment of operational supplies.' index.html

          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          if html.count('data:image/jpeg;base64,') != 1:
              raise SystemExit('Expected exactly one embedded photograph')
          if '2023 - 2026' in html or 'from 2023 to 2026' in html:
              raise SystemExit('Old Vinorva date remains')
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
