name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare self-contained CV site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cat \
            assets/cv-part-00.b64 \
            assets/cv-part-01.b64 \
            assets/cv-part-02.b64 \
            assets/cv-part-03.b64 \
            | tr -d '\r\n ' \
            | base64 --decode > _site/index.html

          python3 -c "from pathlib import Path; import re; html_path=Path('_site/index.html'); svg=Path('assets/profile.svg').read_text(encoding='utf-8'); match=re.search(r'data:image/jpeg;base64,([^\"<]+)', svg); assert match, 'Embedded JPEG not found'; html=html_path.read_text(encoding='utf-8').replace('assets/profile.svg', 'data:image/jpeg;base64,' + match.group(1)); html_path.write_text(html, encoding='utf-8')"

          test -s _site/index.html
          grep -q 'data:image/jpeg;base64,' _site/index.html
          if grep -q 'assets/profile.svg' _site/index.html; then
            echo 'Photo reference was not embedded.' >&2
            exit 1
          fi

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
