name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate self-contained CV
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'data:image/jpeg;base64,' index.html
          grep -q 'jenisha-professional-cv-v7' index.html
          grep -q 'from 2023 to 2025' index.html
          grep -q '<div class="job-date">2023 - 2025</div>' index.html
          grep -q 'Mohamed Visham' index.html
          grep -q 'Ahmed Naaz' index.html
          grep -q 'Vinorva Maldives Pvt Ltd' index.html
          grep -q 'White Saffron, Maldives' index.html
          grep -q 'Monitor stock requirements and support timely replenishment of operational supplies.' index.html

          for legacy in cv-fixes.css cv-fixes.js cv-skills-override.css editorial-details.css final-editorial-pass.css; do
            test ! -e "$legacy"
          done

          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          if html.count('data:image/jpeg;base64,') != 1:
              raise SystemExit('Expected exactly one embedded photograph')
          if '2023 - 2026' in html or 'from 2023 to 2026' in html:
              raise SystemExit('Old Vinorva employment date remains')
          if 'Sunil Kumar Bhusal' in html or 'Nigam Khanal' in html:
              raise SystemExit('Old school references remain')
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
