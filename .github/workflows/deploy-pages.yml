name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        env:
          SITE_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html header-fix.css final-editorial-pass.css _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import os

          version = os.environ['SITE_VERSION'][:12]
          path = Path('_site/index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace("const KEY='jenisha-personal-profile-v6';", "const KEY='jenisha-personal-profile-v9';")
          html = html.replace("photo:'assets/profile.jpg'", "photo:'assets/profile.svg'")
          html = html.replace("meta:'Status and dates to confirm'", "meta:'In Progress'")
          html = html.replace("meta:'Completion year to confirm'", "meta:''")
          html = html.replace("'Three-day Mixology Training'", "'Mixology — 3-Day Training'")
          html = html.replace("<small>${x.school}<br>${x.meta}</small>", "<small>${x.school}${x.meta?`<br>${x.meta}`:''}</small>")

          html = html.replace('</head>', (
              f'<link rel="stylesheet" href="./header-fix.css?v={version}">\n'
              f'<link rel="stylesheet" href="./final-editorial-pass.css?v={version}">\n'
              '</head>'
          ))

          path.write_text(html, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
