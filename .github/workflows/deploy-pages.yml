name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare self-contained site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path

          page = Path('_site/index.html')
          css = Path('editorial-details.css').read_text(encoding='utf-8')
          html = page.read_text(encoding='utf-8')

          marker = '<!-- final-editorial-details -->'
          inline = f'\n{marker}\n<style>\n{css}\n</style>\n'
          html = html.replace('</head>', inline + '</head>')
          page.write_text(html, encoding='utf-8')
          PY

      - name: Verify final design is embedded
        run: |
          grep -q "final-editorial-details" _site/index.html
          grep -q "Hospitality  •  Guest Service  •  Food & Beverage" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
