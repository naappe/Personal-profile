name: Deploy Personal Profile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s documents.html
          grep -q 'data:image/jpeg;base64,' index.html
          grep -q 'jenisha-professional-cv-v8' index.html
          grep -q 'from 2023 to 2025' index.html
          grep -q '<div class="job-date">2023 - 2025</div>' index.html
          grep -q 'documents.html#employment' index.html
          grep -q 'Supporting Documents' documents.html
          if grep -q '<h2 class="section-title">References</h2>' index.html; then exit 1; fi
          if grep -q 'Mohamed Visham' index.html; then exit 1; fi
          if grep -q 'Ahmed Naaz' index.html; then exit 1; fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html documents.html _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
