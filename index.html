<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenisha Adhikari | Professional CV</title>
<style>html,body{margin:0;min-height:100%;background:#f7f2e9;font-family:Arial,Helvetica,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#29421f;font-weight:700;letter-spacing:.08em}.error{padding:24px;color:#771f22}</style>
</head>
<body>
<div class="loading" id="loading">Loading professional CV…</div>
<script>
(async()=>{
  try{
    const files=['assets/cv-part-00.b64','assets/cv-part-01.b64','assets/cv-part-02.b64','assets/cv-part-03.b64'];
    const parts=await Promise.all(files.map(async path=>{
      const response=await fetch(path+'?v=20260805-photo',{cache:'no-store'});
      if(!response.ok) throw new Error('Unable to load '+path);
      return (await response.text()).trim();
    }));
    const binary=atob(parts.join(''));
    const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes)
      .replace('assets/profile.svg','assets/profile.svg?v=20260805-photo');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loading').className='error';
    document.getElementById('loading').textContent='The CV could not be loaded. Please refresh the page.';
    console.error(error);
  }
})();
</script>
</body>
</html>
