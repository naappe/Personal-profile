<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f5f">
<title>Jenisha Adhikari | Personal Profile</title>
<style>
:root{--navy:#173f5f;--blue:#284b9b;--ink:#171a1f;--text:#3f444a;--muted:#7b8086;--rule:#d9dcdf;--surface:#edf2f5;--paper:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--surface);line-height:1.45}
button,input,textarea{font:inherit}a{color:inherit}.appbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 18px;background:var(--navy);color:#fff}.brand{font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}.btn.primary{background:#e4b33e;color:#18222b;border:0;font-weight:700}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;width:min(1480px,calc(100% - 28px));margin:24px auto 48px;align-items:start}.editor{position:sticky;top:76px;max-height:calc(100vh - 94px);overflow:auto;padding:16px;background:#f7f8fa;border:1px solid #dfe5e9}.editor h2{margin:0 0 4px;font-size:18px}.editor p{margin:0 0 12px;color:var(--muted);font-size:12px}.panel{border-top:1px solid #dce2e6}.panel summary{padding:13px 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.field{display:grid;gap:4px;margin-bottom:12px}.field label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#58646d}.field input,.field textarea{width:100%;border:1px solid #cbd5db;border-radius:2px;padding:9px;background:#fff;color:#1e303d}.field textarea{min-height:92px;resize:vertical}.hint{font-size:11px;color:var(--muted);margin-top:-6px}.secondary{width:100%;margin-top:8px;border:1px solid #cbd5db;padding:9px;background:#fff;cursor:pointer}
.preview{min-width:0}.page-stack{display:grid;gap:28px}.page{position:relative;width:min(100%,210mm);min-height:297mm;margin:auto;background:#fff;box-shadow:0 18px 45px rgba(30,49,61,.16);overflow:hidden}
.hero{position:relative;display:grid;grid-template-columns:136px minmax(0,1fr);gap:50px;min-height:214px;padding:24px 42px 0;align-items:start}.hero:before{content:"";position:absolute;left:0;top:56px;width:104px;height:32px;background:var(--blue);z-index:1}.hero:after{content:"";position:absolute;left:184px;top:56px;width:30px;height:30px;background:var(--blue);z-index:3}.photo{position:relative;z-index:2;width:136px;height:178px;overflow:hidden;background:#fff}.photo img{width:100%;height:100%;display:block;object-fit:contain;object-position:center top}.identity{position:relative;z-index:4;padding-top:0}.identity h1{margin:0 0 4px;color:var(--ink);font-size:32px;line-height:1.04}.role{margin:0;color:#858a90;font-size:11px;font-weight:400}.summary{max-width:470px;margin:26px 0 0;font-size:10.7px;line-height:1.5}.summary:before{content:"";display:block;width:34px;height:2px;margin-bottom:10px;background:var(--blue)}
.page-body{display:grid;grid-template-columns:30% 70%;padding:0 42px 42px}.sidebar{padding-right:28px}.main{padding-left:34px;border-left:1px solid var(--rule)}.section{margin-bottom:28px}.section-title{display:flex;align-items:center;gap:11px;margin:0 0 14px;color:var(--ink);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.section-title:after{content:"";height:1px;flex:1;background:var(--rule)}
.contact{display:grid;gap:9px;font-size:9.8px}.contact-item{display:grid;grid-template-columns:13px minmax(0,1fr);gap:8px}.skills{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}.skill{position:relative;padding:5px 0 5px 9px;border-bottom:1px solid #ececee;font-size:9.6px}.skill:before{content:"";position:absolute;left:0;top:10px;width:3px;height:3px;background:var(--blue)}.row{padding:7px 0;border-bottom:1px solid #ececee;font-size:9.7px}.row strong{display:block;color:var(--ink)}.row small{display:block;margin-top:2px;color:var(--muted);font-size:8.8px}.simple-list{margin:0;padding-left:14px;font-size:9.7px}.simple-list li+li{margin-top:4px}
.timeline{position:relative;display:grid;gap:34px}.timeline:before{content:"";position:absolute;left:13px;top:4px;bottom:4px;width:1px;background:#666b70}.entry{position:relative;padding-left:38px;break-inside:avoid}.entry:before{content:"";position:absolute;left:9px;top:3px;width:9px;height:9px;background:var(--ink)}.entry-head{display:flex;justify-content:space-between;gap:14px;align-items:baseline}.entry h3{margin:0;color:var(--ink);font-size:11.5px;text-transform:uppercase}.date{color:var(--muted);font-size:9px;font-weight:600;white-space:nowrap}.meta{margin:3px 0 8px;color:var(--muted);font-size:9.4px;font-style:italic}.entry ul{margin:0;padding-left:14px;font-size:9.7px;line-height:1.52}.entry li+li{margin-top:4px}
.cover{padding:24px 42px 42px}.cover-grid{display:grid;grid-template-columns:30% 70%;margin-top:18px}.cover-info{padding-right:28px}.cover-main{padding-left:34px;border-left:1px solid var(--rule)}.cover-label{margin:0 0 6px;color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.cover-value{margin:0 0 22px;font-size:9.7px;line-height:1.5}.cover-main h2{margin:0 0 10px;color:var(--ink);font-size:14px;letter-spacing:.06em;text-transform:uppercase}.cover-main h3{margin:0 0 12px;color:var(--ink);font-size:10.5px}.cover-text{font-size:10px;line-height:1.65;white-space:pre-line}.signature{margin-top:32px}.signature strong{display:block;color:var(--ink);font-size:10px}.signature span{font-size:9px;color:var(--muted)}
body.readonly .editor{display:none}body.readonly .shell{grid-template-columns:1fr;width:min(1120px,calc(100% - 20px))}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.editor{position:static;max-height:none}}
@media(max-width:700px){.appbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.page{min-height:auto}.hero{grid-template-columns:1fr;gap:16px;padding:20px 22px 16px}.hero:before{top:50px;width:72px;height:28px}.hero:after{left:160px;top:50px;width:26px;height:26px}.page-body,.cover-grid{grid-template-columns:1fr}.page-body,.cover{padding-left:22px;padding-right:22px}.sidebar{padding:0}.main,.cover-main{padding:24px 0 0;border-left:0;border-top:1px solid var(--rule)}.cover-info{padding-right:0}.skills{grid-template-columns:1fr}}
@page{size:A4;margin:0}@media print{body{background:#fff}.appbar,.editor{display:none!important}.shell{display:block;width:auto;margin:0}.page-stack{display:block}.page{width:210mm;min-height:297mm;margin:0;box-shadow:none;break-after:page}.page:last-child{break-after:auto}.hero{grid-template-columns:36mm minmax(0,1fr);gap:13mm;min-height:57mm;padding:6.5mm 11mm 0}.hero:before{top:14.5mm;width:27mm;height:8mm}.hero:after{left:48.5mm;top:14.5mm;width:8mm;height:8mm}.photo{width:36mm;height:47mm}.identity h1{font-size:23pt}.role{font-size:7.7pt}.summary{margin-top:6.5mm;font-size:7.9pt;line-height:1.48;max-width:112mm}.page-body{padding:0 11mm 11mm}.sidebar{padding-right:8mm}.main{padding-left:9mm}.section{margin-bottom:7.5mm}.section-title{font-size:8.8pt;margin-bottom:3.5mm}.contact,.row,.simple-list,.skill{font-size:7.4pt}.timeline{gap:9mm}.entry{padding-left:10mm}.entry h3{font-size:8.7pt}.date{font-size:6.8pt}.meta{font-size:7.1pt}.entry ul{font-size:7.4pt}.cover{padding:6.5mm 11mm 11mm}.cover-grid{margin-top:5mm}.cover-main{padding-left:9mm}.cover-info{padding-right:8mm}.cover-text{font-size:8pt;line-height:1.65}.hero:before,.hero:after,.entry:before,.skill:before{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<header class="appbar"><div class="brand">Personal Profile</div><div class="actions"><button class="btn" id="toggleMode">Public view</button><button class="btn" id="copyLink">Copy link</button><button class="btn" id="exportJson">Export data</button><button class="btn primary" id="printCv">Print / PDF</button></div></header>
<div class="shell">
<aside class="editor">
<h2>Edit CV</h2><p>Two-page editorial CV and cover-letter set.</p>
<details class="panel" open><summary>Identity</summary><div>
<div class="field"><label>Profile photo</label><input id="photoInput" type="file" accept="image/*"></div>
<div class="field"><label>Full name</label><input id="nameInput"></div>
<div class="field"><label>Professional title</label><input id="titleInput"></div>
<div class="field"><label>Location</label><input id="locationInput"></div>
<div class="field"><label>Phone</label><input id="phoneInput"></div>
<div class="field"><label>Email</label><input id="emailInput"></div>
<div class="field"><label>Summary</label><textarea id="summaryInput"></textarea></div>
</div></details>
<details class="panel"><summary>Experience</summary><div class="field"><label>Experience JSON</label><textarea id="experienceInput" style="min-height:240px"></textarea></div></details>
<details class="panel"><summary>Education</summary><div class="field"><label>Education JSON</label><textarea id="educationInput"></textarea></div></details>
<details class="panel"><summary>Skills & languages</summary><div class="field"><label>Skills, one per line</label><textarea id="skillsInput"></textarea></div><div class="field"><label>Languages JSON</label><textarea id="languagesInput"></textarea></div><div class="field"><label>Interests, one per line</label><textarea id="interestsInput"></textarea></div></details>
<details class="panel"><summary>Cover letter</summary><div class="field"><label>Recipient / company</label><input id="recipientInput"></div><div class="field"><label>Date</label><input id="coverDateInput"></div><div class="field"><label>Letter body</label><textarea id="coverInput" style="min-height:260px"></textarea></div></details>
<details class="panel"><summary>Data</summary><button class="secondary" id="resetData">Reset CV</button><button class="secondary" id="exportJson2">Export JSON</button></details>
</aside>
<main class="preview"><div class="page-stack">
<article class="page">
<header class="hero"><div class="photo"><img id="profilePhoto" alt="Portrait of Jenisha Adhikari"></div><div class="identity"><h1 id="nameOutput"></h1><p class="role" id="titleOutput"></p><p class="summary" id="summaryOutput"></p></div></header>
<div class="page-body"><aside class="sidebar"><section class="section"><h2 class="section-title">Contact</h2><div class="contact" id="contactList"></div></section><section class="section"><h2 class="section-title">Core skills</h2><div class="skills" id="skillsList"></div></section><section class="section"><h2 class="section-title">Languages</h2><div id="languagesList"></div></section><section class="section"><h2 class="section-title">Interests</h2><ul class="simple-list" id="interestsList"></ul></section></aside><main class="main"><section class="section"><h2 class="section-title">Work experience</h2><div class="timeline" id="experienceList"></div></section><section class="section"><h2 class="section-title">Education</h2><div id="educationList"></div></section></main></div>
</article>
<article class="page">
<header class="hero"><div class="photo"><img id="profilePhoto2" alt=""></div><div class="identity"><h1 id="nameOutput2"></h1><p class="role" id="titleOutput2"></p><p class="summary" id="summaryOutput2"></p></div></header>
<div class="cover"><div class="cover-grid"><aside class="cover-info"><p class="cover-label">Info</p><p class="cover-value" id="recipientOutput"></p><p class="cover-label">Contact</p><p class="cover-value" id="coverContact"></p><p class="cover-label">Date</p><p class="cover-value" id="coverDateOutput"></p></aside><main class="cover-main"><h2>Cover Letter</h2><h3>Dear Sir / Madam,</h3><div class="cover-text" id="coverOutput"></div><div class="signature"><strong id="signatureName"></strong><span id="signatureTitle"></span></div></main></div></div>
</article>
</div></main></div>
<script>
const KEY='jenisha-personal-profile-v11';
const DEFAULT={personal:{name:'Jenisha Adhikari',title:'Hospitality and Guest Service Professional',location:'Itahari, Sunsari, Nepal',phone:'+977 9810432149',email:'adhikarijenisha7429@gmail.com',photo:'assets/profile.svg'},summary:'Guest-focused hospitality professional experienced in restaurant reception, reservations, table coordination and food-and-beverage service. Skilled in welcoming guests, responding to enquiries and supporting efficient daily operations.',skills:['Guest reception','Reservations','Table coordination','Food & beverage service','Complaint handling','Telephone communication','Buffet setup','Mise en place','Teamwork','Basic computer skills'],experience:[{title:'Hostess',company:'Premier Hotel Lounge & Restaurant',location:'Itahari, Nepal',date:'Feb 2021 – Present',details:['Welcomed guests and guided them to suitable tables.','Managed reservations, telephone enquiries and large-party bookings.','Communicated waiting times and supported an organised guest queue.','Balanced table allocation across service staff.']},{title:'Management Trainee (OJT)',company:'Itahari Banquet',location:'Itahari, Nepal',date:'',details:['Prepared buffet areas and completed mise en place before service.','Took and relayed food and beverage orders accurately.','Checked guest satisfaction and helped resolve service concerns.']}],education:[{degree:'Diploma in Hotel Management',school:'Premier Hotel School',meta:'In Progress'},{degree:'Grade XII / School Leaving Certificate Examination',school:'Peace Zone Awasiya Secondary School',meta:'2021 · GPA 3.31'},{degree:'Secondary Education Examination',school:"Sunsari St. Xavier’s",meta:''}],languages:[{language:'Nepali',level:'Native'},{language:'Hindi',level:'Conversational'},{language:'English',level:'Professional'}],interests:['Travelling','Cooking','Learning new skills'],cover:{recipient:'Hiring Manager\nCompany / Hotel',date:'',body:'I am writing to express my interest in a hospitality and guest-service position. My experience in restaurant reception, reservations, table coordination and food-and-beverage service has strengthened my ability to welcome guests professionally and support smooth daily operations.\n\nI am dependable, service-oriented and comfortable working with guests and colleagues in busy environments. I would value the opportunity to contribute my communication, organisation and hospitality skills to your team.\n\nThank you for considering my application. I would welcome the opportunity to discuss how my experience can support your organisation.'}};
let data;try{data={...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'')}}catch{data=structuredClone(DEFAULT)}
const $=id=>document.getElementById(id),lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean),parse=(v,f)=>{try{return JSON.parse(v)}catch{return f}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields={nameInput:$('nameInput'),titleInput:$('titleInput'),locationInput:$('locationInput'),phoneInput:$('phoneInput'),emailInput:$('emailInput'),summaryInput:$('summaryInput'),skillsInput:$('skillsInput'),experienceInput:$('experienceInput'),educationInput:$('educationInput'),languagesInput:$('languagesInput'),interestsInput:$('interestsInput'),recipientInput:$('recipientInput'),coverDateInput:$('coverDateInput'),coverInput:$('coverInput')};
function sync(){nameInput.value=data.personal.name;titleInput.value=data.personal.title;locationInput.value=data.personal.location;phoneInput.value=data.personal.phone;emailInput.value=data.personal.email;summaryInput.value=data.summary;skillsInput.value=data.skills.join('\n');experienceInput.value=JSON.stringify(data.experience,null,2);educationInput.value=JSON.stringify(data.education,null,2);languagesInput.value=JSON.stringify(data.languages,null,2);interestsInput.value=data.interests.join('\n');recipientInput.value=data.cover.recipient;coverDateInput.value=data.cover.date;coverInput.value=data.cover.body}
function render(){['profilePhoto','profilePhoto2'].forEach(id=>$(id).src=data.personal.photo);['nameOutput','nameOutput2'].forEach(id=>$(id).textContent=data.personal.name);['titleOutput','titleOutput2'].forEach(id=>$(id).textContent=data.personal.title);['summaryOutput','summaryOutput2'].forEach(id=>$(id).textContent=data.summary);
$('contactList').innerHTML=[['⌖',data.personal.location],['☎',data.personal.phone],['✉',data.personal.email]].map(x=>`<div class="contact-item"><span>${x[0]}</span><span>${esc(x[1])}</span></div>`).join('');
$('skillsList').innerHTML=data.skills.map(x=>`<div class="skill">${esc(x)}</div>`).join('');
$('languagesList').innerHTML=data.languages.map(x=>`<div class="row"><strong>${esc(x.language)}</strong><small>${esc(x.level)}</small></div>`).join('');
$('interestsList').innerHTML=data.interests.map(x=>`<li>${esc(x)}</li>`).join('');
$('experienceList').innerHTML=data.experience.map(x=>`<article class="entry"><div class="entry-head"><h3>${esc(x.title)}</h3>${x.date?`<span class="date">${esc(x.date)}</span>`:''}</div><p class="meta">${esc(x.company)} · ${esc(x.location)}</p><ul>${(x.details||[]).map(y=>`<li>${esc(y)}</li>`).join('')}</ul></article>`).join('');
$('educationList').innerHTML=data.education.map(x=>`<div class="row"><strong>${esc(x.degree)}</strong><small>${esc(x.school)}${x.meta?`<br>${esc(x.meta)}`:''}</small></div>`).join('');
recipientOutput.textContent=data.cover.recipient;coverDateOutput.textContent=data.cover.date||'—';coverOutput.textContent=data.cover.body;coverContact.textContent=`${data.personal.phone}\n${data.personal.email}`;signatureName.textContent=data.personal.name;signatureTitle.textContent=data.personal.title}
function update(){data.personal={...data.personal,name:nameInput.value.trim(),title:titleInput.value.trim(),location:locationInput.value.trim(),phone:phoneInput.value.trim(),email:emailInput.value.trim()};data.summary=summaryInput.value.trim();data.skills=lines(skillsInput.value);data.experience=parse(experienceInput.value,data.experience);data.education=parse(educationInput.value,data.education);data.languages=parse(languagesInput.value,data.languages);data.interests=lines(interestsInput.value);data.cover={recipient:recipientInput.value,date:coverDateInput.value,body:coverInput.value};localStorage.setItem(KEY,JSON.stringify(data));render()}
Object.values(fields).forEach(e=>{e.addEventListener('input',update);e.addEventListener('change',update)});
photoInput.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader;r.onload=()=>{data.personal.photo=r.result;localStorage.setItem(KEY,JSON.stringify(data));render()};r.readAsDataURL(f)};
toggleMode.onclick=e=>{document.body.classList.toggle('readonly');e.currentTarget.textContent=document.body.classList.contains('readonly')?'Edit view':'Public view'};
printCv.onclick=()=>print();copyLink.onclick=async()=>{await navigator.clipboard.writeText(location.href.split('#')[0]);copyLink.textContent='Copied';setTimeout(()=>copyLink.textContent='Copy link',1200)};
function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jenisha-cv-data.json';a.click();URL.revokeObjectURL(a.href)}exportJson.onclick=exportData;exportJson2.onclick=exportData;
resetData.onclick=()=>{if(confirm('Reset the CV?')){data=structuredClone(DEFAULT);localStorage.setItem(KEY,JSON.stringify(data));sync();render()}};
sync();render();
</script>
</body></html>
